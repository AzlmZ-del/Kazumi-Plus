org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.enableJetifier=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
# Kotlin 增量缓存在本机关闭：Kotlin 2.4.20 + Gradle 9.5.0 下编译插件仍会报
# "Could not close incremental caches"(class-fq-name-to-source.tab 等) 并让构建失败。
# 2026-11-16 实测打开后 8 个任务同时失败，清缓存重试仍复现，故保留关闭。
kotlin.incremental=false
android.r8.proguardAndroidTxt.disallowed=false
