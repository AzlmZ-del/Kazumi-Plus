org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.enableJetifier=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
# Kotlin 增量缓存在本机关闭：Kotlin 2.4.20 + Gradle 9.5.0 下编译插件会报
# "Could not close incremental caches"(class-fq-name-to-source.tab 等)，让构建失败。
# 2026-11-24 排查结论：与 Gradle 并行无关（parallel=false 单模块 --max-workers=1
# 仍复现），也与 compiler.execution.strategy=in-process 无关，是 Kotlin 侧
# "Storage ... is already registered" 的重复注册缺陷，无本地可用的规避手段。
kotlin.incremental=false
android.r8.proguardAndroidTxt.disallowed=false
# 关掉 Flutter 3.50 给 --split-per-abi 输出追加的 ABI*1000 偏移：
# 正式版要恒等于 pubspec 的 +NNNNN（2.6.3 → 20603），测试包的 ABI 后缀
# 由 android/app/build.gradle 的 kazumiTestBuild 分支自己加。
force-version-code-ignoring-abi=true
