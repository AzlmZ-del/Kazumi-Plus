plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

// Release signing material. Kept outside version control; CI writes it from
// secrets before building. Without it we fall back to the debug key so that a
// plain `flutter run --release` keeps working.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
def hasReleaseKeystore = keystorePropertiesFile.exists()
if (hasReleaseKeystore) {
    keystorePropertiesFile.withReader('UTF-8') { reader ->
        keystoreProperties.load(reader)
    }
}

android {
    namespace "com.example.kazumi"
    compileSdk flutter.compileSdkVersion
    // Use the highest NDK required by the native plugins. Newer NDKs remain
    // backward compatible with plugins that declare an older version.
    ndkVersion "28.2.13676358"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        // Local mod build: uses a distinct application id so it can be installed
        // side by side with the official Kazumi package.
        applicationId "com.patch.kazumi"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion flutter.targetSdkVersion
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    signingConfigs {
        if (hasReleaseKeystore) {
            release {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            // Sign with the local release key when it is present so in-app
            // updates can upgrade over an installed build. CI provides the same
            // key from secrets; without it we fall back to the debug key.
            signingConfig hasReleaseKeystore
                ? signingConfigs.release
                : signingConfigs.debug
        }
    }

    // 这一段看着像「旧机型兼容开关」，实际决定 jniLibs 是否压缩进 APK。
    // 删掉后 AGP 9 按新默认不压缩 libapp/libflutter/libmpv，APK 由 31.6MB 涨到 61.1MB
    // （2026-11-16 实测）。所以必须保留，不是历史包袱。
    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

flutter {
    source '../..'
}

dependencies {}

// 正式分包沿用上游编号；测试包直接用 pubspec 基数，不叠加 Flutter 的 ABI 偏移。
ext.abiCodes = ["armeabi-v7a": 1, "arm64-v8a": 2, "x86_64": 4]
def testAbiCodes = [
    'android-arm'  : 1,
    'android-arm64': 2,
    'android-x64'  : 4,
]
def isTestBuild =
    (project.findProperty('kazumiTestBuild') ?: 'false').toString().toBoolean()
import com.android.build.OutputFile
android.applicationVariants.all { variant ->
    variant.outputs.each { output ->
        def abiCode = project.ext.abiCodes.get(output.getFilter(OutputFile.ABI))
        if (isTestBuild && abiCode == null) {
            abiCode = testAbiCodes[
                (project.findProperty('target-platform') ?: '').toString()
            ]
        }
        if (abiCode != null) {
            def baseCode = isTestBuild ? flutterVersionCode.toInteger() : variant.versionCode
            output.versionCodeOverride = baseCode * 10 + abiCode
        }
    }
}
